name: Test prs_created not set when skip-github-pull-request is true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          release-type: node
          skip-github-release: 'true'
          skip-github-pull-request: 'true'
          target-branch: 'act-harness'

      - name: Assert prs_created is not set (skipped)
        env:
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "prs_created: '$PRS_CREATED'"
          echo "releases_created: '$RELEASES_CREATED'"
          # When both are skipped, neither output should be set (empty string)
          if [ -n "$PRS_CREATED" ]; then
            echo "FAIL: prs_created should not be set when skip-github-pull-request=true, got: $PRS_CREATED"
            exit 1
          fi
          if [ -n "$RELEASES_CREATED" ]; then
            echo "FAIL: releases_created should not be set when skip-github-release=true, got: $RELEASES_CREATED"
            exit 1
          fi
          echo "PASS: both outputs are empty as expected when both are skipped"
